<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Demo disc - french indie games</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var buildUrl = "Build/";
      var loaderUrl = buildUrl + "demo-disc.pixelnest.io.loader.js";
      var config = {
        dataUrl: buildUrl + "demo-disc.pixelnest.io.data.unityweb",
        frameworkUrl: buildUrl + "demo-disc.pixelnest.io.framework.js.unityweb",
        codeUrl: buildUrl + "demo-disc.pixelnest.io.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Pixelnest Studio",
        productName: "Demo disc - french indie games",
        productVersion: "1.0.0"
      };

      // iPadOS reports itself as a Mac; touch support gives it away.
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
      if (isMobile) {
        container.className = "unity-mobile";
        // Render at CSS resolution instead of the 2-3x native density, for frame rate.
        config.devicePixelRatio = 1;
      }
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
